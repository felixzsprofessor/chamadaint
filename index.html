<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desempenho Escolar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --p: #1f4e78;
      --p2: #2c6ba0;
      --ps: #eaf2fb;
      --bg: #f3f7fb;
      --card: #ffffff;
      --txt: #18232f;
      --txt2: #6f7d8d;
      --borda: #dfeaf5;
      --sucesso: #2e9d68;
      --alerta: #d99a00;
      --perigo: #d9534f;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--txt);
    }

    body { min-height: 100vh; }

    .app {
      max-width: 1180px;
      margin: 32px auto;
      padding: 0 20px 40px;
    }

    .topbar {
      background: linear-gradient(135deg, var(--p), var(--p2));
      color: white;
      border-radius: 14px 14px 0 0;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 24px rgba(31, 78, 120, 0.12);
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .topbar .tag {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--borda);
      border-radius: 0 0 14px 14px;
      padding: 18px 20px 20px;
      box-shadow: 0 10px 24px rgba(17, 29, 42, 0.05);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar .busca {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--ps);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 260px;
      flex: 1;
    }

    .toolbar input {
      border: none;
      background: transparent;
      flex: 1;
      color: var(--txt);
      font-size: 14px;
      outline: none;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: 0.2s ease;
    }

    .btn:hover { filter: brightness(1.05); }
    .btn.primary { background: var(--p); color: white; }
    .btn.secondary {
      background: var(--ps);
      color: var(--p);
      border: 1px solid var(--borda);
    }
    .btn.danger { background: var(--perigo); color: white; }
    .btn.mini { padding: 5px 9px; font-size: 11px; }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
      font-size: 13px;
    }

    th {
      background: var(--p);
      color: #fff;
      text-align: left;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--borda);
      vertical-align: middle;
    }

    tbody tr:hover td { background: rgba(31, 78, 120, 0.03); }
    tbody tr.clickable-row { cursor: pointer; }
    tbody tr.clickable-row:hover td { background: rgba(31, 78, 120, 0.06); }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.aprovado { background: rgba(46, 157, 104, 0.12); color: var(--sucesso); }
    .badge.recuperacao { background: rgba(217, 154, 0, 0.12); color: var(--alerta); }
    .badge.reprovado { background: rgba(217, 83, 79, 0.12); color: var(--perigo); }

    .acao-grupo {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .modal-fundo {
      position: fixed;
      inset: 0;
      background: rgba(15, 25, 35, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-fundo.aberto { display: flex; }

    .modal-conteudo {
      position: relative;
      width: min(760px, 100%);
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--borda);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.26);
      padding: 24px 22px 20px;
    }

    .modal-fechar {
      position: absolute;
      top: 12px;
      right: 14px;
      border: none;
      background: transparent;
      color: var(--txt2);
      font-size: 22px;
      cursor: pointer;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 3px solid var(--p);
      padding: 6px 0 14px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--p);
    }

    .modal-header select {
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 8px 10px;
      background: white;
      color: var(--txt);
      font-size: 13px;
    }

    .chart-box {
      height: 320px;
      position: relative;
    }

    @media (max-width: 640px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar .busca {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>📊 Desempenho Escolar</h1>
      <div class="tag">EF2 • 2025</div>
    </header>

    <div class="card">
      <div class="toolbar">
        <div class="busca">
          <span>🔎</span>
          <input type="text" id="buscaAluno" placeholder="Buscar aluno..." />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Turma</th>
            <th>Média</th>
            <th>Situação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbodyAlunos"></tbody>
      </table>
    </div>
  </div>

  <div id="modalEvolucaoAluno" class="modal-fundo" onclick="if(event.target.id === 'modalEvolucaoAluno') fecharModalEvolucaoAluno();">
    <div class="modal-conteudo">
      <button class="modal-fechar" onclick="fecharModalEvolucaoAluno()">✕</button>

      <div class="modal-header">
        <h2 id="evolucaoAlunoTitulo">Evolução do aluno</h2>
        <label style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--txt2);">
          Disciplina:
          <select id="selEvolucaoDisciplina"></select>
        </label>
      </div>

      <div class="chart-box">
        <canvas id="evolucaoAlunoChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const alunos = [
      { id: 1, nome: 'Ana Laura Silva', turma: '7A', notas: { Matematica: [6.8, 7.4, 8.1, 8.7], Portugues: [7.2, 7.8, 8.5, 8.9], Historia: [7.0, 7.3, 8.0, 8.4], Ciencias: [6.9, 7.5, 8.2, 8.6] } },
      { id: 2, nome: 'Bruno Costa', turma: '7A', notas: { Matematica: [5.4, 6.1, 6.8, 7.5], Portugues: [6.5, 6.9, 7.4, 7.8], Historia: [5.9, 6.3, 7.1, 7.5], Ciencias: [6.2, 6.7, 7.2, 7.9] } },
      { id: 3, nome: 'Carla Souza', turma: '7B', notas: { Matematica: [8.0, 8.3, 8.9, 9.1], Portugues: [8.7, 8.8, 9.0, 9.4], Historia: [7.6, 8.1, 8.4, 8.9], Ciencias: [8.1, 8.6, 8.8, 9.0] } },
      { id: 4, nome: 'Daniel Moreira', turma: '7B', notas: { Matematica: [4.9, 5.8, 6.2, 6.8], Portugues: [5.7, 6.0, 6.5, 7.0], Historia: [5.3, 5.9, 6.4, 7.2], Ciencias: [6.1, 6.4, 6.9, 7.5] } },
      { id: 5, nome: 'Eduarda Reis', turma: '8A', notas: { Matematica: [7.4, 7.9, 8.4, 8.8], Portugues: [7.7, 8.1, 8.6, 9.0], Historia: [7.8, 8.0, 8.5, 8.9], Ciencias: [7.5, 7.8, 8.3, 8.7] } }
    ];

    const disciplinas = ['Todas as disciplinas', 'Matematica', 'Portugues', 'Historia', 'Ciencias'];
    let chartEvolucao = null;

    function mediaLista(lista) {
      if (!lista || !lista.length) return null;
      const valores = lista.filter(v => v !== null && v !== undefined && !isNaN(Number(v)));
      if (!valores.length) return null;
      return Number((valores.reduce((s, v) => s + Number(v), 0) / valores.length).toFixed(1));
    }

    function calcularMediaAluno(aluno, disciplina = 'Todas as disciplinas') {
      const valores = disciplina === 'Todas as disciplinas'
        ? Object.values(aluno.notas).flat()
        : aluno.notas[disciplina] || [];

      const media = mediaLista(valores);
      return media ?? 0;
    }

    function situacaoTexto(media) {
      if (media >= 7.0) return 'Aprovado';
      if (media >= 5.0) return 'Recuperação';
      return 'Reprovado';
    }

    function situacaoClasse(media) {
      if (media >= 7.0) return 'aprovado';
      if (media >= 5.0) return 'recuperacao';
      return 'reprovado';
    }

    function renderAlunos() {
      const termo = document.getElementById('buscaAluno').value.trim().toLowerCase();
      const filtrados = alunos.filter(a => !termo || a.nome.toLowerCase().includes(termo));

      const tbody = document.getElementById('tbodyAlunos');
      tbody.innerHTML = filtrados.map((aluno, index) => {
        const media = calcularMediaAluno(aluno, 'Todas as disciplinas');
        const situacao = situacaoClasse(media);

        return `
          <tr class="clickable-row" data-id="${aluno.id}" onclick="abrirEvolucaoAluno(${aluno.id}, 'Todas as disciplinas')">
            <td>${index + 1}</td>
            <td>${aluno.nome}</td>
            <td>${aluno.turma}</td>
            <td>${media.toFixed(1)}</td>
            <td><span class="badge ${situacao}">${situacaoTexto(media)}</span></td>
            <td>
              <div class="acao-grupo">
                <button class="btn secondary mini" onclick="event.stopPropagation(); abrirEvolucaoAluno(${aluno.id}, 'Todas as disciplinas')">Evolução</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function montarSelectEvolucaoDisciplina() {
      const select = document.getElementById('selEvolucaoDisciplina');
      if (!select) return;
      select.innerHTML = disciplinas.map(d => `<option value="${d}">${d}</option>`).join('');
    }

    function fecharModalEvolucaoAluno() {
      const modal = document.getElementById('modalEvolucaoAluno');
      if (modal) modal.classList.remove('aberto');
    }

    function abrirEvolucaoAluno(alunoId, disciplina = 'Todas as disciplinas') {
      const aluno = alunos.find(a => a.id === alunoId);
      if (!aluno) return;

      const modal = document.getElementById('modalEvolucaoAluno');
      const titulo = document.getElementById('evolucaoAlunoTitulo');
      const select = document.getElementById('selEvolucaoDisciplina');
      const canvas = document.getElementById('evolucaoAlunoChart');

      if (!modal || !titulo || !select || !canvas) return;

      titulo.textContent = `Evolução de ${aluno.nome}`;
      select.value = disciplina;

      const labels = ['1º Bim', '2º Bim', '3º Bim', '4º Bim'];
      const dados = labels.map((_, index) => {
        if (disciplina === 'Todas as disciplinas') {
          const medias = Object.values(aluno.notas).map(base => base[index]);
          return mediaLista(medias);
        }

        const valores = aluno.notas[disciplina] || [];
        return valores[index] ?? null;
      });

      if (chartEvolucao) {
        chartEvolucao.destroy();
        chartEvolucao = null;
      }

      chartEvolucao = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: disciplina === 'Todas as disciplinas' ? 'Média geral' : disciplina,
            data: dados,
            borderColor: '#1f4e78',
            backgroundColor: 'rgba(31,78,120,0.12)',
            fill: true,
            tension: 0.35,
            borderWidth: 2,
            pointRadius: 5,
            pointBackgroundColor: '#1f4e78'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: true } },
          scales: {
            y: {
              min: 0,
              max: 10,
              ticks: { stepSize: 1 }
            }
          }
        }
      });

      modal.classList.add('aberto');
    }

    document.getElementById('buscaAluno').addEventListener('input', renderAlunos);
    document.getElementById('selEvolucaoDisciplina').addEventListener('change', function () {
      const alunoSelecionado = document.getElementById('evolucaoAlunoTitulo').textContent.replace('Evolução de ', '');
      const aluno = alunos.find(a => a.nome === alunoSelecionado);
      if (aluno) {
        abrirEvolucaoAluno(aluno.id, this.value);
      }
    });

    montarSelectEvolucaoDisciplina();
    renderAlunos();
  </script>
</body>
</html>
